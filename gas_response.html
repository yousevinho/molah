ss\x3d\\\x22px-5 py-2.5 text-white rounded-xl font-bold text-sm shadow transition\\\x22\x3e\\n                            \x7b\x7b capitalModal.type \x3d\x3d\x3d \x27add\x27 ? \x27تأكيد الزيادة (+)\x27 : \x27تأكيد السحب (-)\x27 \x7d\x7d\\n                        \x3c\\\/button\x3e\\n                    \x3c\\\/div\x3e\\n                \x3c\\\/div\x3e\\n            \x3c\\\/div\x3e\\n        \x3c\\\/div\x3e\\n\\n        \\n        \x3cdiv v-if\x3d\\\x22cloudModal.show\\\x22 class\x3d\\\x22fixed inset-0 bg-black\/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm\\\x22\x3e\\n            \x3cdiv class\x3d\\\x22bg-white rounded-3xl p-6 sm:p-8 w-full max-w-2xl shadow-2xl animate-fade-in max-h-\x5b90vh\x5d overflow-y-auto\\\x22\x3e\\n                \x3cdiv class\x3d\\\x22flex justify-between items-start mb-4\\\x22\x3e\\n                    \x3cdiv class\x3d\\\x22flex items-center gap-3\\\x22\x3e\\n                        \x3cdiv class\x3d\\\x22w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-2xl shadow-inner\\\x22\x3e\\n                            \x3ci class\x3d\\\x22fa-solid fa-cloud-arrow-up\\\x22\x3e\x3c\\\/i\x3e\\n                        \x3c\\\/div\x3e\\n                        \x3cdiv\x3e\\n                            \x3ch3 class\x3d\\\x22text-xl font-bold text-gray-800\\\x22\x3eالربط اللحظي مع حسابك قوقل (Google Sheets)\x3c\\\/h3\x3e\\n                            \x3cp class\x3d\\\x22text-xs text-gray-500\\\x22\x3eحفظ فوري سحابي لكل العملاء والعمليات في جدول خاص بحسابك\x3c\\\/p\x3e\\n                        \x3c\\\/div\x3e\\n                    \x3c\\\/div\x3e\\n                    \x3cbutton @click\x3d\\\x22cloudModal.show \x3d false\\\x22 class\x3d\\\x22text-gray-400 hover:text-gray-600 text-lg p-1\\\x22\x3e\\n                        \x3ci class\x3d\\\x22fa-solid fa-xmark\\\x22\x3e\x3c\\\/i\x3e\\n                    \x3c\\\/button\x3e\\n                \x3c\\\/div\x3e\\n\\n                \\n                \x3cdiv class\x3d\\\x22space-y-4 text-sm text-gray-700 bg-gray-50 p-5 rounded-2xl border border-gray-200\\\x22\x3e\\n                    \x3ch4 class\x3d\\\x22font-bold text-emerald-800 text-sm flex items-center gap-2\\\x22\x3e\\n                        \x3ci class\x3d\\\x22fa-solid fa-list-check text-emerald-600\\\x22\x3e\x3c\\\/i\x3e خطوات التفعيل لمرة واحدة فقط (دقيقة واحدة):\\n                    \x3c\\\/h4\x3e\\n\\n                    \x3col class\x3d\\\x22space-y-2.5 list-decimal list-inside text-xs leading-relaxed text-gray-600\\\x22\x3e\\n                        \x3cli\x3e\\n                            افتح متصفحك وادخل على الرابط: \\n                            \x3ca href\x3d\\\x22https:\/\/sheets.new\\\x22 target\x3d\\\x22_blank\\\x22 class\x3d\\\x22font-bold text-emerald-600 hover:underline\\\x22\x3esheets.new (اضغط هنا لفتح قوقل شيت جديد)\x3c\\\/a\x3e.\\n                        \x3c\\\/li\x3e\\n                        \x3cli\x3e\\n                            من القائمة العلوية في قوقل شيت اختر: \x3cstrong\x3eالامتدادات (Extensions)\x3c\\\/strong\x3e ثم \x3cstrong\x3eApps Script\x3c\\\/strong\x3e.\\n                        \x3c\\\/li\x3e\\n                        \x3cli\x3e\\n                            امسح أي كود مكتوب هناك، ثم اضغط على زر \x3cstrong\x3e\\\x22نسخ الكود\\\x22\x3c\\\/strong\x3e بالأسفل والصقه في الصفحة.\\n                        \x3c\\\/li\x3e\\n                        \x3cli\x3e\\n                            اضغط الزر الأزرق \x3cstrong\x3eنشر (Deploy)\x3c\\\/strong\x3e في الأعلى ⬅ \x3cstrong\x3eنشر جديد (New deployment)\x3c\\\/strong\x3e.\\n                        \x3c\\\/li\x3e\\n                        \x3cli\x3e\\n                            اختر نوع النشر \x3cstrong\x3eتطبيق ويب (Web app)\x3c\\\/strong\x3e، وفي خانة (Who has access \/ من يملك الوصول) اختر: \x3cstrong\x3eالجميع (Anyone)\x3c\\\/strong\x3e، ثم اضغط Deploy.\\n                        \x3c\\\/li\x3e\\n                        \x3cli\x3e\\n                            انسخ رابط تطبيق الويب (الذي ينتهي بـ \x3ccode class\x3d\\\x22bg-gray-200 px-1 py-0.5 rounded text-emerald-800 font-mono\\\x22\x3e\/exec\x3c\\\/code\x3e) والصقه في الخانة بالأسفل!\\n                        \x3c\\\/li\x3e\\n                    \x3c\\\/ol\x3e\\n\\n                    \x3cdiv class\x3d\\\x22pt-2 flex justify-start\\\x22\x3e\\n                        \x3cbutton @click\x3d\\\x22copyAppsScriptCode\\\x22 class\x3d\\\x22bg-emerald-700 hover:bg-emerald-600 text-white text-xs font-bold py-2 px-4 rounded-xl shadow transition flex items-center gap-2\\\x22\x3e\\n                            \x3ci class\x3d\\\x22fa-solid fa-copy\\\x22\x3e\x3c\\\/i\x3e\\n                            \x3cspan\x3e\x7b\x7b copyBtnText \x7d\x7d\x3c\\\/span\x3e\\n                        \x3c\\\/button\x3e\\n                    \x3c\\\/div\x3e\\n                \x3c\\\/div\x3e\\n\\n                \\n                \x3cdiv class\x3d\\\x22mt-6 space-y-3\\\x22\x3e\\n                    \x3clabel class\x3d\\\x22block text-xs font-bold text-gray-700\\\x22\x3eرابط تطبيق الويب الخاص بقوقل شيت (Web App URL):\x3c\\\/label\x3e\\n                    \x3cinput type\x3d\\\x22url\\\x22 v-model\x3d\\\x22cloudModal.urlInput\\\x22 placeholder\x3d\\\x22https:\/\/script.google.com\/macros\/s\/...\/exec\\\x22 class\x3d\\\x22w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none text-xs font-mono text-gray-800 bg-white shadow-inner\\\x22\x3e\\n                    \\n                    \x3cdiv class\x3d\\\x22flex flex-wrap justify-between items-center gap-2 pt-2\\\x22\x3e\\n                        \x3cdiv\x3e\\n                            \x3cbutton v-if\x3d\\\x22googleSyncUrl\\\x22 @click\x3d\\\x22disconnectGoogle\\\x22 class\x3d\\\x22text-xs text-rose-600 hover:text-rose-700 font-bold hover:underline\\\x22\x3e\\n                                \x3ci class\x3d\\\x22fa-solid fa-link-slash ml-1\\\x22\x3e\x3c\\\/i\x3e إلغاء الربط السحابي\\n                            \x3c\\\/button\x3e\\n                        \x3c\\\/div\x3e\\n                        \x3cdiv class\x3d\\\x22flex items-center gap-2\\\x22\x3e\\n                            \x3cbutton @click\x3d\\\x22cloudModal.show \x3d false\\\x22 class\x3d\\\x22px-4 py-2 text-gray-500 hover:text-gray-700 text-xs font-bold transition\\\x22\x3eإغلاق\x3c\\\/button\x3e\\n                            \x3cbutton @click\x3d\\\x22saveGoogleSyncUrl\\\x22 class\x3d\\\x22px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow transition flex items-center gap-1.5\\\x22\x3e\\n                                \x3ci class\x3d\\\x22fa-solid fa-floppy-disk\\\x22\x3e\x3c\\\/i\x3e حفظ الرابط وتفعيل المزامنة اللحظية\\n                            \x3c\\\/button\x3e\\n                        \x3c\\\/div\x3e\\n                    \x3c\\\/div\x3e\\n                \x3c\\\/div\x3e\\n            \x3c\\\/div\x3e\\n        \x3c\\\/div\x3e\\n\\n    \x3c\\\/div\x3e\\n\\n    \x3cscript\x3e\\n        const \x7b createApp \x7d \x3d Vue;\\n\\n        createApp(\x7b\\n            data() \x7b\\n                const today \x3d new Date();\\n                const currentMonthStr \x3d today.getFullYear() + \x27-\x27 + String(today.getMonth() + 1).padStart(2, \x270\x27);\\n                \\n                return \x7b\\n                    activeTab: \x27global\x27, \\n                    selectedMonth: currentMonthStr,\\n                    importMonth: currentMonthStr,\\n                    searchQuery: \x27\x27,\\n                    \\n                    \\n                    totalFundCapital: 0,\\n                    monthlyExtraCapital: \x7b\x7d,\\n                    \\n                    clients: \x5b\x5d,\\n                    reports: \x5b\x5d,\\n                    \\n                    newClient: \x7b name: \x27\x27, phone: \x27\x27, principal: \x27\x27 \x7d,\\n                    \\n                    payModal: \x7b show: false, client: null, discount: 0 \x7d,\\n                    capitalModal: \x7b show: false, type: \x27add\x27, amount: \x27\x27 \x7d,\\n                    \\n                    \\n                    googleSyncUrl: \x27https:\/\/script.google.com\/macros\/s\/AKfycbxhFWcDv-Z7s6E33Od4jd9v85OiGR8PL87ml4VibUstH5Slxp8_-rf9M-CAdwWcUaK0\/exec\x27,\\n                    syncStatus: \x27idle\x27, \\n                    lastSyncTime: \x27\x27,\\n                    cloudModal: \x7b show: false, urlInput: \x27https:\/\/script.google.com\/macros\/s\/AKfycbxhFWcDv-Z7s6E33Od4jd9v85OiGR8PL87ml4VibUstH5Slxp8_-rf9M-CAdwWcUaK0\/exec\x27 \x7d,\\n                    copyBtnText: \x27نسخ كود الربط بنقرة واحدة\x27\\n                \x7d\\n            \x7d,\\n            computed: \x7b\\n                currentMonthExtra: \x7b\\n                    get() \x7b\\n                        return this.monthlyExtraCapital\x5bthis.selectedMonth\x5d || 0;\\n                    \x7d,\\n                    set(val) \x7b\\n                        this.monthlyExtraCapital\x5bthis.selectedMonth\x5d \x3d Math.max(0, parseFloat(val) || 0);\\n                    \x7d\\n                \x7d,\\n\\n                availableCashDisplay() \x7b\\n                    const fund \x3d parseFloat(this.totalFundCapital) || 0;\\n                    const active \x3d this.globalStats.activeCapital;\\n                    return Math.max(0, fund - active);\\n                \x7d,\\n\\n                filteredClients() \x7b\\n                    return this.clients.filter(c \x3d\x3e c.targetMonth \x3d\x3d\x3d this.selectedMonth).sort((a, b) \x3d\x3e \x7b\\n                        const order \x3d \x7b \x27نشط\x27: 1, \x27ممدد\x27: 2, \x27مسدد\x27: 3 \x7d;\\n                        if(order\x5ba.status\x5d !\x3d\x3d order\x5bb.status\x5d) return order\x5ba.status\x5d - order\x5bb.status\x5d;\\n                        return new Date(a.dueDate) - new Date(b.dueDate);\\n                    \x7d);\\n                \x7d,\\n                \\n                filteredReports() \x7b\\n                    return this.reports.filter(r \x3d\x3e r.targetMonth \x3d\x3d\x3d this.selectedMonth);\\n                \x7d,\\n\\n                globalStats() \x7b\\n                    const activeCapital \x3d this.clients.filter(c \x3d\x3e c.status \x3d\x3d\x3d \x27نشط\x27).reduce((sum, c) \x3d\x3e sum + c.principal, 0);\\n                    const totalCapitalAllTime \x3d this.clients.filter(c \x3d\x3e c.status !\x3d\x3d \x27ممدد\x27).reduce((sum, c) \x3d\x3e sum + c.principal, 0);\\n                    \\n                    const totalCollected \x3d this.reports.reduce((sum, r) \x3d\x3e sum + r.collectedTotal, 0);\\n                    \\n                    const explicitDiscounts \x3d this.reports.reduce((sum, r) \x3d\x3e \x7b\\n                        const d \x3d (r.type \x3d\x3d\x3d \x27تمديد\x27 \x26\x26 !r.discount) ? 30 : (r.discount || 0);\\n                        return sum + d;\\n                    \x7d, 0);\\n                    \\n                    const grossProfitAllTime \x3d this.clients.reduce((sum, c) \x3d\x3e sum + c.profit, 0);\\n                    const totalNetProfitAllTime \x3d grossProfitAllTime - explicitDiscounts;\\n\\n                    return \x7b \\n                        activeCapital, \\n                        totalCapitalAllTime, \\n                        totalCollected, \\n                        totalDiscounts: explicitDiscounts,\\n                        totalNetProfitAllTime \\n                    \x7d;\\n                \x7d,\\n\\n                monthsSummary() \x7b\\n                    const allMonths \x3d new Set(\x5b\\n                        ...this.clients.map(c \x3d\x3e c.targetMonth), \\n                        ...this.reports.map(r \x3d\x3e r.targetMonth),\\n                        ...Object.keys(this.monthlyExtraCapital).filter(k \x3d\x3e (this.monthlyExtraCapital\x5bk\x5d || 0) \x3e 0)\\n                    \x5d);\\n                    \\n                    const summary \x3d \x5b\x5d;\\n
